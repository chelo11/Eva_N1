name: CI - Integración continua

# Se ejecuta con cada push a develop y con cada pull request hacia main
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build y validación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # --- AJUSTAR según el lenguaje real de su microservicio ---
